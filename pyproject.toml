[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nearby-events-mcp"
version = "0.1.0"
description = "MCP server that lets Claude find events near you, filtered by day, price, category, time and size"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ismail Jaija" }]
keywords = ["mcp", "model-context-protocol", "claude", "events", "ai-agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",  # 2.x renamed FastMCP -> MCPServer; developed against 1.27
    "httpx>=0.27",
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Repository = "https://github.com/lmakinaa/nearby-events-mcp"
Issues = "https://github.com/lmakinaa/nearby-events-mcp/issues"

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nearby-events-mcp = "nearby_events_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nearby_events_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
